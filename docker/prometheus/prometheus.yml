global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: mysql
    static_configs:
      - targets:
          - mysql-exporter:9104

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: php-fpm
    static_configs:
      - targets:
          - php-fpm-exporter:9253